name: Crossplane CLI
description: >
  Puts the crossplane CLI on PATH, from the artifact built by the `cli` job.

  TEMPORARY: the CLI is built from source rather than installed from a release,
  because TypeScript embedded functions are not in a released CLI yet — see
  https://github.com/crossplane/cli/pull/170. Once a release includes them,
  delete this composite action along with the `cli` job, and go back to calling
  crossplane-contrib/setup-crossplane-action directly in each job.

runs:
  using: composite
  steps:
    - name: Download the Crossplane CLI
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: crossplane-cli
        path: ${{ runner.temp }}/bin

    - name: Put the Crossplane CLI on PATH
      shell: bash
      run: |
        chmod +x "${RUNNER_TEMP}/bin/crossplane"
        echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

    - name: Report the CLI version
      shell: bash
      run: crossplane version --client
